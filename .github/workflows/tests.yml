name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Smoke-test pipeline imports
        run: |
          python -c "from rdp_analytics import build_person_dataset, run_full_analysis"
          python -c "from rdp_analytics.figures import figure_1_distributions, figure_6_lca, figure_7_cart, figure_8_rf_importance, figure_9_umap"
