[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdp-analytics"
version = "0.1.0"
description = "Reproducible analysis pipeline for Recovery Data Platform exports"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Marcus S. Bell", email = "marcus@bellwetherbiotech.com"},
    {name = "Chase M. Walton"},
]
keywords = ["recovery", "substance use disorder", "peer recovery", "RDP", "JSAT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "umap-learn>=0.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
notebook = ["jupyter>=1.0", "ipython>=8.0"]
dev = ["pytest>=7.0", "jupyter>=1.0", "ipython>=8.0"]

[project.urls]
Repository = "https://github.com/sononeuro/rdp-analytics"
Issues = "https://github.com/sononeuro/rdp-analytics/issues"

[project.scripts]
rdp-analytics = "rdp_analytics.pipeline:main"

[tool.setuptools.packages.find]
include = ["rdp_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
