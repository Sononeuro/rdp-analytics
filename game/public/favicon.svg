<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bellwether mark">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1d3a" />
      <stop offset="100%" stop-color="#142a52" />
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7eb6ff" />
      <stop offset="100%" stop-color="#c9a8ff" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- pentagon for the five fields of study -->
  <polygon
    points="32,10 54,26 46,52 18,52 10,26"
    fill="none"
    stroke="url(#ring)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="33" r="6.5" fill="#f4f6fb" />
  <circle cx="32" cy="33" r="2.6" fill="#0b1d3a" />
</svg>
